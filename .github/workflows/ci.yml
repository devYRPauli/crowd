name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.mjs"
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vite preview --port 4173 --host 127.0.0.1 &
      - run: npx wait-on http://127.0.0.1:4173 || sleep 5
      - run: node scripts/smoke.mjs
        env:
          CROWD_CHROME: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: out/smoke
