<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crowd — Event layout rehearsal</title>
    <style>
      body { max-width: 56rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.5 system-ui, sans-serif; color: #19302a; background: #f5f7f4; }
      pre { padding: 1.5rem; background: white; border: 1px solid #d6dfd9; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Crowd</h1>
    <p>Rehearse an event layout. Compare measured trade-offs.</p>
    <p>This is the scaffold. Simulation and layout editing are coming next.</p>
    <p id="status" role="status">Loading the sample scene…</p>
    <details>
      <summary>Inspect sample scene</summary>
      <pre id="scene"></pre>
    </details>
    <script>
      async function loadScene() {
        const status = document.getElementById('status');
        try {
          const response = await fetch('/api/scene');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const scene = await response.json();
          document.getElementById('scene').textContent = JSON.stringify(scene, null, 2);
          status.textContent = 'Sample scene loaded. No simulation has been run.';
        } catch (error) {
          status.textContent = `Could not load scene: ${error.message}`;
        }
      }
      loadScene();
    </script>
  </body>
</html>
